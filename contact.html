<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お問い合わせ・掲載情報の訂正｜開店閉店マップ</title><link rel="canonical" href="https://open-close-map.onrender.com/contact.html"><style>body{margin:0;background:#f5f7fa;color:#182a40;font:16px/1.9 system-ui,sans-serif}header,footer{padding:22px;background:#14263d;color:white}main{max-width:760px;margin:32px auto;padding:28px;background:white;border-radius:16px}a{color:#086aaf}header a,footer a{color:white}nav{display:flex;flex-wrap:wrap;gap:16px}h1{font-size:28px}h2{font-size:21px;margin-top:30px}label{display:block;margin:20px 0}input:not([type=checkbox]),textarea{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #9cabb9;border-radius:7px}button{background:#086aaf;color:white;border:0;border-radius:7px;padding:14px 24px;font:inherit;cursor:pointer}button:disabled{opacity:.5}#result{white-space:pre-wrap}.trap{position:absolute;left:-9999px}@media(max-width:800px){main{margin:16px;padding:20px}}</style></head><body><header><strong>開店閉店マップ</strong><nav><a href="/">トップ</a><a href="/about.html">運営・編集方針</a><a href="/privacy.html">プライバシー</a><a href="/contact.html">お問い合わせ・訂正</a></nav></header><main><h1>お問い合わせ・掲載情報の訂正</h1><p>店舗情報の誤り、権利に関するご連絡、サイトへのお問い合わせを受け付けます。店舗への予約や営業状況の照会は、店舗の公式窓口へお願いします。</p><form id="inquiry"><label>対象ページURL（任意）<input name="page_url" type="url" maxlength="1000"></label><label>メールアドレス（任意）<input name="email" type="email" maxlength="254" autocomplete="email"></label><label>内容（必須・10〜3000文字）<textarea name="message" rows="8" minlength="10" maxlength="3000" required placeholder="どの情報が誤っているか、正しい内容と確認できる公式ページ等をお知らせください。"></textarea></label><label class="trap" aria-hidden="true">この欄は空欄にしてください<input name="website" tabindex="-1" autocomplete="off"></label><label><input type="checkbox" name="consent" required> <a href="/privacy.html">プライバシーポリシー</a>を確認し、内容の送信に同意します。</label><p>送信後は受付番号を表示します。返信や対応時期をお約束するものではありません。</p><button type="submit">送信する</button><p id="result" role="status" aria-live="polite"></p></form></main><footer><nav><a href="/">トップ</a><a href="/about.html">運営・編集方針</a><a href="/privacy.html">プライバシー</a><a href="/contact.html">お問い合わせ・訂正</a></nav></footer><script>
const form=document.getElementById('inquiry'),result=document.getElementById('result');
form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;result.textContent='送信中…';const data=Object.fromEntries(new FormData(form));data.consent=form.elements.consent.checked;try{const response=await fetch('https://buzz-now-1.onrender.com/open-close/api/inquiries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:AbortSignal.timeout(60000)});const payload=await response.json();if(!response.ok)throw new Error(typeof payload.detail==='string'?payload.detail:'送信できませんでした。');result.textContent='受け付けました。受付番号：'+payload.receipt;form.reset();}catch(error){result.textContent='受付完了を確認できませんでした。'+error.message+' 内容を控えて時間をおいてお試しください。';}finally{button.disabled=false;}});
</script></body></html>
