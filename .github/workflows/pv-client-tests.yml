name: PV client and existing navigation regression tests
on:
  push:
    branches: [main]
    paths: ['analytics.js', 'first-party-pv.js', 'scripts/*.mjs', '.github/workflows/pv-client-tests.yml']
  pull_request:
    paths: ['analytics.js', 'first-party-pv.js', 'scripts/*.mjs', '.github/workflows/pv-client-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check analytics.js && node --check first-party-pv.js
      - run: node scripts/test-pv.mjs
      - run: node scripts/test-seo-growth.mjs
