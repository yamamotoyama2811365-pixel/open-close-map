name: Add status pages to sitemap once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-status-pages-to-sitemap-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add open and close landing pages to sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/collectors/seo_pages.py')
          s=p.read_text()
          old='urls=[origin.rstrip("/")+"/"]'
          new='urls=[origin.rstrip("/")+"/", origin.rstrip("/")+"/open/", origin.rstrip("/")+"/close/"]'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit sitemap fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/collectors/seo_pages.py
          git commit -m 'Add open and close landing pages to sitemap'
          git push
