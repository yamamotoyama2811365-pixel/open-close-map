name: Shared API read-only verification
on:
  push:
    branches: [ops/shared-api-check]
    paths: [.github/workflows/shared-api-check.yml]
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check shared API, database, CORS and scoped identity
        shell: python
        run: |
          import json, os, time, urllib.request, urllib.error, urllib.parse
          base = "https://buzz-now-1.onrender.com/open-close"
          old = "https://open-close-map-api.onrender.com"
          def request(url, method="GET", headers=None):
              return urllib.request.urlopen(urllib.request.Request(url,method=method,headers=headers or {}),timeout=30)
          def data(url, headers=None):
              with request(url,headers=headers) as r: return json.load(r)
          for attempt in range(40):
              try:
                  assert data(base+"/ready")["ready"] is True
                  break
              except Exception:
                  if attempt == 39: raise
                  time.sleep(15)
          stores = data(base+"/api/stores?limit=1")
          assert stores["items"], "No stores returned"
          sid = stores["items"][0]["id"]
          assert data(base+f"/api/stores/{sid}") == data(old+f"/api/stores/{sid}")
          assert data(base+"/api/stats")["mode"] == "database"
          for path in ["/api/categories","/api/national-insights","/api/public-config"]:
              data(base+path)
          with request(base+f"/seo/store/{sid}") as r:
              html=r.read().decode()
              assert "https://open-close-map.onrender.com" in html
          with request(base+"/api/stores",method="OPTIONS",headers={"Origin":"https://open-close-map.onrender.com","Access-Control-Request-Method":"GET"}) as r:
              assert r.headers["access-control-allow-origin"] == "https://open-close-map.onrender.com"
          oidc_url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]+"&audience="+urllib.parse.quote(base,safe="")
          token=data(oidc_url,{"Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})["value"]
          bearer={"Authorization":"Bearer "+token}
          for attempt in range(30):
              try:
                  assert data(base+"/api/source-health",bearer)["ok"] is True
                  break
              except urllib.error.HTTPError as e:
                  if e.code != 403 or attempt == 29: raise
                  time.sleep(10)
                  token=data(oidc_url,{"Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})["value"]
                  bearer={"Authorization":"Bearer "+token}
          assert data(base+"/api/prefecture-coverage",bearer)["ok"] is True
          for headers,expected in [({},401),(bearer,403)]:
              try:
                  request(base+"/api/admin/inquiries",headers=headers)
              except urllib.error.HTTPError as e:
                  assert e.code == expected, e.code
              else:
                  raise RuntimeError("Private inbox was not protected")
          print("VERIFIED: same store data, shared database ready, public APIs, SEO HTML, CORS and scoped GitHub identity.")
          print("No collection, inquiry creation or private inbox access performed.")

      - name: Confirm the deployed frontend uses the shared API
        shell: python
        run: |
          import time, urllib.request, json
          front="https://open-close-map.onrender.com"
          shared="https://buzz-now-1.onrender.com"
          files=["/app.js","/detail.js","/analytics.js","/status-page.js","/contact.html"]
          for attempt in range(25):
              try:
                  for path in files:
                      with urllib.request.urlopen(front+path+"?verify=shared-20260910",timeout=30) as r:
                          content=r.read().decode()
                      assert shared+"/open-close" in content, path
                      assert "https://open-close-map-api.onrender.com" not in content, path
                  with urllib.request.urlopen(front,timeout=30) as r:
                      assert r.status==200 and "shared-20260910" in r.read().decode()
                  with urllib.request.urlopen(shared+"/ready",timeout=30) as r:
                      assert json.load(r)["database"]=="ok"
                  break
              except Exception:
                  if attempt==24: raise
                  time.sleep(10)
          print("VERIFIED: five public client files use the shared API; both sites are available.")

      - name: Verify public SEO routes after rewrite cutover
        shell: python
        run: |
          import json, os, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          front="https://open-close-map.onrender.com"
          base="https://buzz-now-1.onrender.com/open-close"
          probe="rewrite-"+os.environ["GITHUB_RUN_ID"]
          def get(url):
              with urllib.request.urlopen(url,timeout=60) as r:
                  assert r.status==200
                  return r.read().decode()
          stores=json.loads(get(base+"/api/stores?limit=1"))["items"]
          sid=stores[0]["id"]
          sitemap=get(front+"/sitemap.xml?migration_probe="+probe)
          root=ET.fromstring(sitemap)
          urls=[e.text for e in root.iter() if e.tag.endswith("}loc")]
          assert urls and all(u.startswith(front+"/") for u in urls)
          paths=[f"/store/{sid}"]
          for prefix in ["/area/","/category/"]:
              match=next((u for u in urls if u.startswith(front+prefix)),None)
              assert match, prefix
              paths.append(match[len(front):])
          for path in paths:
              url=front+urllib.parse.quote(urllib.parse.unquote(path),safe="/")
              html=get(url+"?migration_probe="+probe)
              assert "<html" in html.lower() and "canonical" in html.lower()
              assert front in html
              print("VERIFIED public SEO:",path)
          robots=get(front+"/robots.txt?migration_probe="+probe)
          assert front+"/sitemap.xml" in robots
          print("VERIFIED sitemap URLs:",len(urls))
          print("ORIGIN_PROBE:",probe)
