name: Test first-party PV delivery once
on:
  push:
    paths:
      - '.github/workflows/test-first-party-pv-once.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send browser-compatible test pageview
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X POST 'https://buzz-now-1.onrender.com/open-close/api/page-view' \
            -H 'Origin: https://open-close-map.onrender.com' \
            -H 'Content-Type: text/plain' \
            -H 'User-Agent: Mozilla/5.0' \
            --data '{"page":"/","source":"direct_or_unknown","is_test":true}')
          echo "HTTP $code"
          test "$code" = "204"
