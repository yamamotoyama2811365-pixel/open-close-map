<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>開店閉店マップ</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand">開店閉店マップ</div><nav><a href="#latest">最新情報</a><a href="#areas">エリア</a></nav></header>
<section class="hero"><div><h1>あたらしいお店の開店も、<br>惜しまれるお店の閉店も。</h1><p>全国の開店・閉店・テナント情報を自動収集。</p><div class="search"><input id="q" placeholder="店舗名・エリア・業種で検索"><button id="search">検索</button></div></div><aside><b>登録店舗</b><strong id="storesTotal">-</strong><b>未処理候補</b><strong id="discoveryTotal">-</strong></aside></section>
<section class="stats"><div><span>本日の開店</span><strong id="todayOpen">0</strong></div><div><span>今週の開店予定</span><strong id="weekOpen">0</strong></div><div><span>今週の閉店予定</span><strong id="weekClose">0</strong></div><div><span>テナント募集</span><strong id="tenant">0</strong></div></section>
<main><section id="latest" class="card"><h2>最新の開店・閉店情報</h2><div id="grid" class="grid">読み込み中...</div></section>
<section id="areas" class="card"><h2>エリアから探す</h2><div class="areas"><button data-pref="北海道">北海道</button><button data-pref="東京都">東京都</button><button data-pref="神奈川県">神奈川県</button><button data-pref="愛知県">愛知県</button><button data-pref="大阪府">大阪府</button><button data-pref="福岡県">福岡県</button></div></section></main>
<script src="app.js"></script></body></html>
