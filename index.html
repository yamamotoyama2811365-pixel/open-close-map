<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>開店閉店マップ｜全国の開店・閉店・テナント情報</title>
  <meta name="description" content="全国の開店・閉店・テナント情報をエリア別・業種別にチェック。気になる街の新店、閉店、跡地情報をまとめて確認できます。">
  <link rel="stylesheet" href="styles.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5776658615046901"
     crossorigin="anonymous"></script>

  <style>
    .latest-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:20px;
    }
    .latest-head h2{margin:0}

    .status-tabs{
      display:flex;
      gap:8px;
      padding:4px;
      background:#f3f5f7;
      border-radius:12px;
      width:max-content;
    }
    .status-tab{
      appearance:none;
      border:0;
      background:transparent;
      padding:9px 18px;
      border-radius:9px;
      font-weight:700;
      cursor:pointer;
      color:#667085;
      transition:.15s ease;
    }
    .status-tab:hover{background:#fff}
    .status-tab.active{
      background:#17263a;
      color:#fff;
      box-shadow:0 2px 6px rgba(0,0,0,.08);
    }
    .status-tab.opening:not(.active){color:#16825d}
    .status-tab.closing:not(.active){color:#c34a4a}
    .status-tab.active.opening{background:#16825d}
    .status-tab.active.closing{background:#c34a4a}

    /* 上部の数字は補助情報としてコンパクト表示 */
    .compact-stats{
      max-width:1180px;
      margin:14px auto 0;
      padding:0 20px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .compact-stat{
      display:flex;
      align-items:baseline;
      gap:6px;
      padding:8px 12px;
      background:#fff;
      border:1px solid #e7ebef;
      border-radius:10px;
      font-size:12px;
      color:#667085;
    }
    .compact-stat strong{
      font-size:15px;
      color:#17263a;
    }
    .compact-stat small{
      font-size:11px;
      color:#98a2b3;
    }

    /* 探す導線をトップで最優先 */
    .finder-wrap{
      max-width:1180px;
      margin:24px auto 0;
      padding:0 20px;
    }
    .finder-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }
    .finder-card{
      background:#fff;
      border:1px solid #e7ebef;
      border-radius:18px;
      padding:24px;
      box-shadow:0 8px 24px rgba(16,24,40,.04);
    }
    .finder-card h2{
      margin:2px 0 18px;
      font-size:22px;
    }
    .finder-note{
      margin:12px 2px 0;
      font-size:12px;
      color:#98a2b3;
    }

    @media(max-width:800px){
      .finder-grid{grid-template-columns:1fr}
    }
    @media(max-width:700px){
      .latest-head{display:block}
      .status-tabs{
        margin-top:14px;
        width:100%;
      }
      .status-tab{flex:1}
      .compact-stats{
        display:grid;
        grid-template-columns:1fr 1fr;
      }
      .compact-stat{
        justify-content:space-between;
      }
    }
  </style>
</head>
<body>
<header class="site-header">
  <div class="brand-wrap">
    <div class="logo-mark">⌖</div>
    <div>
      <div class="brand">開店閉店マップ</div>
      <div class="brand-sub">全国の開店・閉店・テナント情報</div>
    </div>
  </div>
  <nav class="main-nav">
    <a href="#areas">エリアから探す</a>
    <a href="#categories">業種から探す</a>
    <a href="#latest">最新情報</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-copy">
      <div class="eyebrow">OPEN / CLOSE / TENANT</div>
      <h1>街の変化を、<br>いち早く。</h1>
      <p>全国の開店・閉店・テナント情報を、エリアとデータでわかりやすく。</p>
      <div class="search-box">
        <input id="q" placeholder="店舗名・エリア・業種・駅名などで検索">
        <button id="search">検索</button>
      </div>
    </div>

    <div class="hero-side">
      <div class="side-title">いま、街で起きていること</div>
      <div class="side-row"><span>登録店舗情報</span><strong id="storesTotal">-</strong></div>
      <div class="side-row"><span>更新待ち情報</span><strong id="discoveryTotal">-</strong></div>
    </div>
  </div>
</section>

<section class="compact-stats" aria-label="最新集計">
  <div class="compact-stat"><span>本日の開店</span><strong id="todayOpen">0</strong><small>件</small></div>
  <div class="compact-stat"><span>今週の開店予定</span><strong id="weekOpen">0</strong><small>件</small></div>
  <div class="compact-stat"><span>今週の閉店予定</span><strong id="weekClose">0</strong><small>件</small></div>
  <div class="compact-stat"><span>テナント募集確認</span><strong id="tenant">0</strong><small>件</small></div>
</section>

<section class="finder-wrap">
  <div class="finder-grid">
    <section id="areas" class="finder-card">
      <div class="section-label">AREA</div>
      <h2>エリアから探す</h2>
      <div class="area-grid">
        <button data-pref="北海道">北海道</button>
        <button data-pref="東京都">東京都</button>
        <button data-pref="神奈川県">神奈川県</button>
        <button data-pref="愛知県">愛知県</button>
        <button data-pref="大阪府">大阪府</button>
        <button data-pref="福岡県">福岡県</button>
      </div>
    </section>

    <section id="categories" class="finder-card">
      <div class="section-label">CATEGORY</div>
      <h2>業種から探す</h2>
      <div id="categoryGrid" class="category-grid">
        <button data-cat="ラーメン">ラーメン</button>
        <button data-cat="中華">中華</button>
        <button data-cat="カフェ">カフェ</button>
        <button data-cat="焼肉">焼肉</button>
        <button data-cat="美容">美容</button>
        <button data-cat="コンビニ">コンビニ</button>
      </div>
      <p class="finder-note">その他の業種は上部の検索から探せます。</p>
    </section>
  </div>
</section>

<main class="container">
  <section id="latest" class="section-card">
    <div class="section-label">LATEST</div>

    <div class="latest-head">
      <h2 id="latestTitle">最新の開店・閉店情報</h2>

      <div class="status-tabs" role="tablist" aria-label="開店・閉店の切り替え">
        <button class="status-tab active" data-status="all" role="tab" aria-selected="true">すべて</button>
        <button class="status-tab opening" data-status="opening" role="tab" aria-selected="false">開店</button>
        <button class="status-tab closing" data-status="closing" role="tab" aria-selected="false">閉店</button>
      </div>
    </div>

    <div id="grid" class="store-grid">
      <div class="empty">読み込み中...</div>
    </div>
  </section>
</main>

<footer>© 2026 開店閉店マップ</footer>
<script src="app.js"></script>
</body>
</html>
